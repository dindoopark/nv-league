<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NV 내전 리그</title>
    <meta name="description" content="FC Online 클럽 NV 내전 팀리그 순위표와 결과 입력" />
    <meta name="theme-color" content="#10241a" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="top">
      <div class="top-row">
        <div>
          <h1>NV 내전 리그</h1>
          <p class="sub">팀리그전 · 판마다 승 3 · 무 1 · 패 0</p>
        </div>
        <button id="refresh" type="button" class="icon-btn" aria-label="새로고침" title="새로고침">↻</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </header>
    <nav class="tabs" role="tablist" aria-label="보기">
      <a href="#standings" data-tab="standings" role="tab">순위</a>
      <a href="#matrix" data-tab="matrix" role="tab">경기표</a>
      <a href="#players" data-tab="players" role="tab">개인 기록</a>
      <a href="#input" data-tab="input" role="tab">결과 입력</a>
    </nav>
    <main id="view">
      <p class="empty">불러오는 중…</p>
    </main>
    <footer class="foot">
      순위: 승점 → 골득실 → 다득점. 시즌이 끝났을 때 1위가 승점·골득실 동률이면 3:3 결정전.
    </footer>
    <noscript><p class="empty">이 페이지는 자바스크립트가 켜져 있어야 합니다.</p></noscript>
  </body>
