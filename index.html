<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NV 내전 리그</title>
    <meta name="description" content="FC Online 클럽 NV 내전 팀리그 순위·일정·경기표와 결과 입력" />
    <meta name="theme-color" content="#05060c" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305060c'/%3E%3Cpath d='M32 7l21 12v26L32 57 11 45V19z' fill='none' stroke='%23c8ff2e' stroke-width='4'/%3E%3Ctext x='32' y='40' font-family='Arial' font-weight='900' font-size='19' text-anchor='middle' fill='%23ffffff'%3ENV%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <!-- 3D 카드(cards3d.js)가 쓰는 three.js. 순위 탭을 열 때만 실제로 내려받는다. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="wrap topbar-row">
        <a class="brand" href="#standings" aria-label="NV 내전 리그 순위로">
          <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
            <defs>
              <linearGradient id="bm" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#e9ff9a" />
                <stop offset="1" stop-color="#3ce6ff" />
              </linearGradient>
            </defs>
            <path d="M20 2.5 35.5 11.5v17L20 37.5 4.5 28.5v-17z" fill="#0b0e1c" stroke="url(#bm)" stroke-width="2.4" />
            <text x="20" y="25" text-anchor="middle">NV</text>
          </svg>
          <span class="brand-text">
            <b>NV 내전 리그</b>
            <small>FC Online 클럽 팀리그전</small>
          </span>
        </a>
        <div class="top-actions">
          <button id="refresh" type="button" class="icon-btn" aria-label="새로고침" title="새로고침">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3.2h-3.2" /></svg>
          </button>
          <a class="cta" href="#input">
            <span>결과 입력</span>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11m-4-4 4 4-4 4" /></svg>
          </a>
        </div>
      </div>
      <div class="wrap"><p id="status" class="status" role="status"></p></div>
    </header>

    <!-- 순위 탭 위쪽: 3D 카드 무대. 탭을 옮겨도 지우지 않고 숨기기만 한다(app.js·cards3d.js). -->
    <section id="hero" class="hero" aria-label="팀 카드" hidden>
      <div class="wrap viewbar">
        <div class="seg" role="group" aria-label="순위 보기 방식">
          <button type="button" class="seg-btn" data-look="cards" aria-pressed="true">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="3" width="10" height="14" rx="2" /><path d="M2.5 6v8M17.5 6v8" /></svg>
            카드
          </button>
          <button type="button" class="seg-btn" data-look="table" aria-pressed="false">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" /></svg>
            순위표
          </button>
        </div>
        <p class="progress" id="progress"></p>
      </div>
      <div id="stage" class="stage" data-state="loading">
        <div class="loader" aria-hidden="true">
          <span class="loader-pack"><b>NV</b></span>
          <span class="loader-text">카드 팩 준비 중…</span>
        </div>
      </div>
      <p id="cards-live" class="sr-only" aria-live="polite"></p>
    </section>

    <main id="view" class="wrap">
      <p class="empty">불러오는 중…</p>
    </main>

    <nav class="tabbar" role="tablist" aria-label="보기">
      <a href="#standings" data-tab="standings" role="tab" aria-controls="view">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3" /></svg>
        <span>순위</span>
      </a>
      <a href="#schedule" data-tab="schedule" role="tab" aria-controls="view">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" /><path d="M3.5 10h17M8 3v4M16 3v4M8 14h2M14 14h2M8 17h2" /></svg>
        <span>일정</span>
      </a>
      <a href="#matrix" data-tab="matrix" role="tab" aria-controls="view">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5" /><path d="M3.5 9.2h17M3.5 14.8h17M9.2 3.5v17M14.8 3.5v17" /></svg>
        <span>경기표</span>
      </a>
      <a href="#players" data-tab="players" role="tab" aria-controls="view">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6" /><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0" /></svg>
        <span>개인</span>
      </a>
      <a href="#input" data-tab="input" role="tab" aria-controls="view">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16zM13.5 6.5l4 4" /></svg>
        <span>입력</span>
      </a>
    </nav>

    <noscript><p class="empty">이 페이지는 자바스크립트가 켜져 있어야 합니다.</p></noscript>
  </body>
</html>
